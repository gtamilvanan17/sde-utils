<!-- =========================================================================
     SDE Utils — tools/color-palette.html
     Generate harmonious color palettes (complementary/analogous/triadic/mono).
     ========================================================================= -->

<div class="tool-header">
  <div class="tool-header-icon"><i class="bi bi-palette2"></i></div>
  <div class="tool-header-text">
    <h1>Color Palette</h1>
    <p>Generate harmonious color palettes from a base color — complementary, analogous, triadic or monochrome.</p>
  </div>
</div>

<div class="tool-card-panel">
  <div class="toolbar">
    <label class="field-label" for="cp-base" style="margin:0 var(--sp-2) 0 0">Base color</label>
    <input type="color" id="cp-base" value="#3b82f6" style="width:48px; height:36px; border:1px solid var(--border); border-radius:var(--radius-sm); background:none; cursor:pointer;">
    <input type="text" id="cp-hex" class="input-sde-utils" style="width:110px" value="#3b82f6">
    <button class="btn-sde-utils btn-sde-utils-ghost" data-act="random"><i class="bi bi-shuffle"></i> Random base</button>
  </div>

  <div class="seg" role="tablist" aria-label="Harmony">
    <button class="seg-btn is-active" data-scheme="complementary" role="tab">Complementary</button>
    <button class="seg-btn" data-scheme="analogous" role="tab">Analogous</button>
    <button class="seg-btn" data-scheme="triadic" role="tab">Triadic</button>
    <button class="seg-btn" data-scheme="monochrome" role="tab">Monochrome</button>
  </div>

  <div id="cp-swatches" class="cp-swatches"></div>

  <div class="toolbar">
    <button class="btn-sde-utils btn-sde-utils-success" data-act="copyall"><i class="bi bi-clipboard-check"></i> Copy all HEX</button>
    <button class="btn-sde-utils btn-sde-utils-secondary" data-act="copycss"><i class="bi bi-code-slash"></i> Copy as CSS vars</button>
  </div>
</div>

<style>
  .cp-swatches { display:flex; gap:var(--sp-3); flex-wrap:wrap; margin:var(--sp-4) 0; }
  .cp-swatch { flex:1; min-width:110px; border-radius:var(--radius-md); overflow:hidden; border:1px solid var(--border); cursor:pointer; }
  .cp-swatch-color { height:90px; }
  .cp-swatch-label { padding:var(--sp-2); font-size:var(--fs-xs, 0.75rem); font-family:var(--font-mono, monospace); text-align:center; background:var(--surface-2); color:var(--text); }
</style>

<script>
  window.SDEUtilsTools = window.SDEUtilsTools || {};
  window.SDEUtilsTools['color-palette'] = function (root, tool, SDEUtils) {
    'use strict';
    var $ = SDEUtils.$, $$ = SDEUtils.$$, el = SDEUtils.el;

    var baseInput = $('#cp-base', root);
    var hexInput = $('#cp-hex', root);
    var swatchesEl = $('#cp-swatches', root);
    var scheme = 'complementary';
    var current = [];

    function hexToHsl(hex) {
      hex = hex.replace('#', '');
      if (hex.length === 3) hex = hex.split('').map(function (c) { return c + c; }).join('');
      var r = parseInt(hex.slice(0,2),16)/255, g = parseInt(hex.slice(2,4),16)/255, b = parseInt(hex.slice(4,6),16)/255;
      var max = Math.max(r,g,b), min = Math.min(r,g,b);
      var h, s, l = (max+min)/2;
      if (max === min) { h = s = 0; }
      else {
        var d = max - min;
        s = l > 0.5 ? d/(2-max-min) : d/(max+min);
        switch (max) {
          case r: h = (g-b)/d + (g<b?6:0); break;
          case g: h = (b-r)/d + 2; break;
          default: h = (r-g)/d + 4;
        }
        h *= 60;
      }
      return [h, s*100, l*100];
    }

    function hslToHex(h, s, l) {
      h = ((h % 360) + 360) % 360; s /= 100; l /= 100;
      var c = (1 - Math.abs(2*l-1)) * s;
      var x = c * (1 - Math.abs((h/60) % 2 - 1));
      var m = l - c/2;
      var r,g,b;
      if (h < 60) [r,g,b] = [c,x,0];
      else if (h < 120) [r,g,b] = [x,c,0];
      else if (h < 180) [r,g,b] = [0,c,x];
      else if (h < 240) [r,g,b] = [0,x,c];
      else if (h < 300) [r,g,b] = [x,0,c];
      else [r,g,b] = [c,0,x];
      var toHex = function (v) { return Math.round((v+m)*255).toString(16).padStart(2,'0'); };
      return '#' + toHex(r) + toHex(g) + toHex(b);
    }

    function isValidHex(hex) { return /^#?[0-9a-f]{6}$/i.test(hex) || /^#?[0-9a-f]{3}$/i.test(hex); }

    function buildPalette(hex) {
      var hsl = hexToHsl(hex);
      var h = hsl[0], s = hsl[1], l = hsl[2];
      var colors = [];
      if (scheme === 'complementary') {
        colors = [h, h, h+180, h+180, h].map(function (hh, i) {
          var ll = [l*0.6, l, l, l*1.3 > 95 ? 95 : l*1.3, l*0.4][i];
          return hslToHex(hh, s, Math.max(10, Math.min(95, ll)));
        });
      } else if (scheme === 'analogous') {
        colors = [h-30, h-15, h, h+15, h+30].map(function (hh) { return hslToHex(hh, s, l); });
      } else if (scheme === 'triadic') {
        colors = [h, h+120, h+240, h+120, h].map(function (hh, i) {
          var ll = [l, l, l, Math.max(10,l*0.6), Math.min(95,l*1.3)][i];
          return hslToHex(hh, s, ll);
        });
      } else { // monochrome
        colors = [20, 35, 50, 65, 85].map(function (ll) { return hslToHex(h, s, ll); });
      }
      return colors;
    }

    function render(hex) {
      current = buildPalette(hex);
      swatchesEl.innerHTML = '';
      current.forEach(function (c) {
        var sw = el('div', { class: 'cp-swatch', title: 'Click to copy ' + c, onclick: function () { SDEUtils.copy(c); } }, [
          el('div', { class: 'cp-swatch-color', style: 'background:' + c }),
          el('div', { class: 'cp-swatch-label', text: c.toUpperCase() })
        ]);
        swatchesEl.appendChild(sw);
      });
    }

    function fromHexInput() {
      var hex = hexInput.value.trim();
      if (!isValidHex(hex)) { SDEUtils.toast('Enter a valid hex color', 'error'); return; }
      if (hex[0] !== '#') hex = '#' + hex;
      baseInput.value = hex.length === 4
        ? '#' + hex[1]+hex[1]+hex[2]+hex[2]+hex[3]+hex[3]
        : hex;
      render(baseInput.value);
    }

    var actions = {
      random: function () {
        var hex = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6,'0');
        baseInput.value = hex; hexInput.value = hex;
        render(hex);
      },
      copyall: function () { current.length ? SDEUtils.copy(current.join('\n')) : SDEUtils.toast('Nothing to copy', 'info'); },
      copycss: function () {
        if (!current.length) { SDEUtils.toast('Nothing to copy', 'info'); return; }
        var css = ':root {\n' + current.map(function (c, i) { return '  --palette-' + (i+1) + ': ' + c + ';'; }).join('\n') + '\n}';
        SDEUtils.copy(css);
      }
    };
    SDEUtils.on(root, 'click', '[data-act]', function (e, node) {
      var fn = actions[node.dataset.act]; if (fn) fn();
    });

    SDEUtils.on(root, 'click', '.seg-btn', function (e, node) {
      scheme = node.dataset.scheme;
      $$('.seg-btn', root).forEach(function (b) { b.classList.toggle('is-active', b === node); });
      render(baseInput.value);
    });

    SDEUtils.on(baseInput, 'input', function () { hexInput.value = baseInput.value; render(baseInput.value); });
    SDEUtils.on(hexInput, 'change', fromHexInput);
    SDEUtils.on(hexInput, 'keydown', function (e) { if (e.key === 'Enter') fromHexInput(); });

    render(baseInput.value);
  };
</script>
