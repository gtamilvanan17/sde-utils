<!-- =========================================================================
     SDE Utils — tools/tailwind-color-picker.html
     Pick & copy colors from the standard Tailwind CSS palette (50-900).
     ========================================================================= -->

<div class="tool-header">
  <div class="tool-header-icon"><i class="bi bi-eyedropper"></i></div>
  <div class="tool-header-text">
    <h1>Tailwind Color Picker</h1>
    <p>Browse the standard Tailwind CSS color palette. Click a swatch to copy its class name or hex value.</p>
  </div>
</div>

<div class="tool-card-panel">
  <div class="toolbar">
    <input type="text" id="tw-filter" class="input-sde-utils" style="flex:1" placeholder="Filter colors (e.g. blue, 500)…">
    <div class="seg" role="tablist" aria-label="Copy format">
      <button class="seg-btn is-active" data-fmt="class" role="tab">Class</button>
      <button class="seg-btn" data-fmt="hex" role="tab">HEX</button>
    </div>
  </div>

  <div id="tw-grid" class="tw-grid"></div>
</div>

<style>
  .tw-grid { display:flex; flex-direction:column; gap:var(--sp-3); margin-top:var(--sp-4); }
  .tw-row-label { font-size:var(--fs-sm); font-weight:var(--fw-semibold); color:var(--text); text-transform:capitalize; margin-bottom:var(--sp-1); }
  .tw-shades { display:grid; grid-template-columns:repeat(10, 1fr); gap:var(--sp-1); }
  .tw-swatch { border-radius:var(--radius-sm); height:52px; display:flex; align-items:flex-end; justify-content:center;
    cursor:pointer; border:1px solid var(--border); position:relative; transition:transform var(--dur-fast) var(--ease); }
  .tw-swatch:hover { transform:scale(1.06); z-index:1; }
  .tw-swatch span { font-size:10px; padding:2px 0; opacity:0.85; }
</style>

<script>
  window.SDEUtilsTools = window.SDEUtilsTools || {};
  window.SDEUtilsTools['tailwind-color-picker'] = function (root, tool, SDEUtils) {
    'use strict';
    var $ = SDEUtils.$, el = SDEUtils.el;

    var filterEl = $('#tw-filter', root);
    var gridEl = $('#tw-grid', root);
    var format = 'class';

    var PALETTE = {
      slate:   { 50:'#f8fafc',100:'#f1f5f9',200:'#e2e8f0',300:'#cbd5e1',400:'#94a3b8',500:'#64748b',600:'#475569',700:'#334155',800:'#1e293b',900:'#0f172a' },
      gray:    { 50:'#f9fafb',100:'#f3f4f6',200:'#e5e7eb',300:'#d1d5db',400:'#9ca3af',500:'#6b7280',600:'#4b5563',700:'#374151',800:'#1f2937',900:'#111827' },
      red:     { 50:'#fef2f2',100:'#fee2e2',200:'#fecaca',300:'#fca5a5',400:'#f87171',500:'#ef4444',600:'#dc2626',700:'#b91c1c',800:'#991b1b',900:'#7f1d1d' },
      orange:  { 50:'#fff7ed',100:'#ffedd5',200:'#fed7aa',300:'#fdba74',400:'#fb923c',500:'#f97316',600:'#ea580c',700:'#c2410c',800:'#9a3412',900:'#7c2d12' },
      amber:   { 50:'#fffbeb',100:'#fef3c7',200:'#fde68a',300:'#fcd34d',400:'#fbbf24',500:'#f59e0b',600:'#d97706',700:'#b45309',800:'#92400e',900:'#78350f' },
      yellow:  { 50:'#fefce8',100:'#fef9c3',200:'#fef08a',300:'#fde047',400:'#facc15',500:'#eab308',600:'#ca8a04',700:'#a16207',800:'#854d0e',900:'#713f12' },
      green:   { 50:'#f0fdf4',100:'#dcfce7',200:'#bbf7d0',300:'#86efac',400:'#4ade80',500:'#22c55e',600:'#16a34a',700:'#15803d',800:'#166534',900:'#14532d' },
      emerald: { 50:'#ecfdf5',100:'#d1fae5',200:'#a7f3d0',300:'#6ee7b7',400:'#34d399',500:'#10b981',600:'#059669',700:'#047857',800:'#065f46',900:'#064e3b' },
      teal:    { 50:'#f0fdfa',100:'#ccfbf1',200:'#99f6e4',300:'#5eead4',400:'#2dd4bf',500:'#14b8a6',600:'#0d9488',700:'#0f766e',800:'#115e59',900:'#134e4a' },
      sky:     { 50:'#f0f9ff',100:'#e0f2fe',200:'#bae6fd',300:'#7dd3fc',400:'#38bdf8',500:'#0ea5e9',600:'#0284c7',700:'#0369a1',800:'#075985',900:'#0c4a6e' },
      blue:    { 50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',400:'#60a5fa',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8',800:'#1e40af',900:'#1e3a8a' },
      indigo:  { 50:'#eef2ff',100:'#e0e7ff',200:'#c7d2fe',300:'#a5b4fc',400:'#818cf8',500:'#6366f1',600:'#4f46e5',700:'#4338ca',800:'#3730a3',900:'#312e81' },
      violet:  { 50:'#f5f3ff',100:'#ede9fe',200:'#ddd6fe',300:'#c4b5fd',400:'#a78bfa',500:'#8b5cf6',600:'#7c3aed',700:'#6d28d9',800:'#5b21b6',900:'#4c1d95' },
      purple:  { 50:'#faf5ff',100:'#f3e8ff',200:'#e9d5ff',300:'#d8b4fe',400:'#c084fc',500:'#a855f7',600:'#9333ea',700:'#7e22ce',800:'#6b21a8',900:'#581c87' },
      pink:    { 50:'#fdf2f8',100:'#fce7f3',200:'#fbcfe8',300:'#f9a8d4',400:'#f472b6',500:'#ec4899',600:'#db2777',700:'#be185d',800:'#9d174d',900:'#831843' },
      rose:    { 50:'#fff1f2',100:'#ffe4e6',200:'#fecdd3',300:'#fda4af',400:'#fb7185',500:'#f43f5e',600:'#e11d48',700:'#be123c',800:'#9f1239',900:'#881337' }
    };

    function textColorFor(shade) { return shade <= 300 ? '#111827' : '#f9fafb'; }

    function render() {
      var filter = filterEl.value.trim().toLowerCase();
      gridEl.innerHTML = '';
      Object.keys(PALETTE).forEach(function (name) {
        var shades = PALETTE[name];
        var matchName = !filter || name.indexOf(filter) !== -1;
        var shadeKeys = Object.keys(shades).filter(function (s) {
          return matchName || s.indexOf(filter) !== -1;
        });
        if (!shadeKeys.length) return;
        var row = el('div', {}, [
          el('div', { class: 'tw-row-label', text: name }),
          el('div', { class: 'tw-shades' }, shadeKeys.map(function (s) {
            var hex = shades[s];
            var cls = name + '-' + s;
            return el('div', {
              class: 'tw-swatch', style: 'background:' + hex,
              title: cls + ' · ' + hex,
              onclick: function () {
                var value = format === 'class' ? 'bg-' + cls : hex;
                SDEUtils.copy(value);
              }
            }, [ el('span', { text: s, style: 'color:' + textColorFor(parseInt(s,10)) }) ]);
          }))
        ]);
        gridEl.appendChild(row);
      });
      if (!gridEl.children.length) {
        gridEl.appendChild(el('div', { class: 'field-hint', text: 'No colors match "' + filter + '"' }));
      }
    }

    SDEUtils.on(filterEl, 'input', SDEUtils.debounce(render, 150));
    SDEUtils.on(root, 'click', '.seg-btn', function (e, node) {
      format = node.dataset.fmt;
      SDEUtils.$$('.seg-btn', root).forEach(function (b) { b.classList.toggle('is-active', b === node); });
    });

    render();
  };
</script>
