# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: connect this repo on Render, choose "Blueprint", and Render
# reads this file automatically. Free tier: the service spins down after
# 15 min idle and cold-starts on the next request (~30-60s) — expected
# behavior on the free plan, not a bug.
services:
  - type: web
    name: sde-utils
    runtime: docker
    plan: free
    region: oregon
    branch: master
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 8080
