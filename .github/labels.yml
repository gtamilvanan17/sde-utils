# Canonical label set, synced to the repo by .github/workflows/label-sync.yml
# (EndBug/label-sync) on every push to master that touches this file.
# Edit here, not in the GitHub UI — the UI edits get overwritten on next sync.

- name: "bug"
  color: "d73a4a"
  description: "Something isn't working"
- name: "enhancement"
  color: "a2eeef"
  description: "New feature or request"
- name: "documentation"
  color: "0075ca"
  description: "Improvements or additions to documentation"
- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"
- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed"
- name: "question"
  color: "d876e3"
  description: "Further information is requested"
- name: "duplicate"
  color: "cfd3d7"
  description: "This issue or pull request already exists"
- name: "wontfix"
  color: "ffffff"
  description: "This will not be worked on"
- name: "invalid"
  color: "e4e669"
  description: "This doesn't seem right"

- name: "new-tool"
  color: "2563eb"
  description: "Adds a brand new tool to the catalog"
- name: "tool-content"
  color: "60a5fa"
  description: "Changes inside tools/*.html"
- name: "ui"
  color: "1d4ed8"
  description: "Theme, layout, or component styling"
- name: "ci"
  color: "5319e7"
  description: "GitHub Actions / workflow changes"
- name: "docker"
  color: "0e8a16"
  description: "Dockerfile / deployment config"
- name: "dependencies"
  color: "0366d6"
  description: "Dependency / Dependabot updates"

- name: "priority: high"
  color: "b60205"
  description: "Should be looked at soon"
- name: "priority: medium"
  color: "fbca04"
  description: "Normal priority"
- name: "priority: low"
  color: "c2e0c6"
  description: "Nice to have"

- name: "status: needs-triage"
  color: "ededed"
  description: "Not yet reviewed by a maintainer"
- name: "status: in-progress"
  color: "fef2c0"
  description: "Actively being worked on"
- name: "status: blocked"
  color: "e11d48"
  description: "Blocked on something else"

- name: "size: xs"
  color: "c5def5"
  description: "Trivial change"
- name: "size: s"
  color: "bfd4f2"
  description: "Small change"
- name: "size: m"
  color: "9ecbec"
  description: "Medium change"
- name: "size: l"
  color: "7fb2e5"
  description: "Large change — consider splitting"
