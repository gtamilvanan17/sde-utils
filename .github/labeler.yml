# Path-based auto-labeling config for .github/workflows/labeler.yml
# (actions/labeler). A PR gets a label whenever it touches a matching path.

ui:
  - changed-files:
      - any-glob-to-any-file:
          - "assets/css/**"
          - "index.html"

tool-content:
  - changed-files:
      - any-glob-to-any-file:
          - "tools/**"

new-tool:
  - changed-files:
      - any-glob-to-any-file:
          - "data/tools.json"

ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"

docker:
  - changed-files:
      - any-glob-to-any-file:
          - "Dockerfile"
          - "deploy/**"
          - "render.yaml"
          - ".dockerignore"

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
