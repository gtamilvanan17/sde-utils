name: Auto-assign PR author

# Assigns the PR author as the assignee (for tracking) and requests review
# from CODEOWNERS-matched reviewers, so nothing sits unassigned.
on:
  pull_request_target:
    types: [opened, ready_for_review]

permissions:
  pull-requests: write
  contents: read

jobs:
  auto-assign:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: kentaro-m/auto-assign-action@v2.0.2
        with:
          configuration-path: ".github/auto_assign.yml"
