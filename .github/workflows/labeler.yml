name: PR labeler

# Auto-applies labels from .github/labeler.yml based on which paths a PR
# touches (e.g. editing tools/**.html gets "tool-content" automatically).
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: true
